    <style>
        .thank-you-layout {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background-color: var(--bg-page);
        }
        .thank-you-card {
            max-width: 520px;
            width: 100%;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 40px 32px;
            text-align: center;
            box-shadow: var(--shadow-card);
        }
        .thank-you-glyph {
            width: 52px;
            height: 52px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background-color: var(--bg-subtle);
            border: 1px solid var(--border-color);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }
        .thank-you-card h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }
        .thank-you-card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.65;
            margin-bottom: 28px;
        }
        .thank-you-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>

<body>
    <div class="thank-you-layout">
